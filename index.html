<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Apps</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(135deg, #14586b, #0d7377);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    padding: 32px;
  }
  h1 { text-align: center; margin: 0 0 20px; color: #23303a; font-size: 1.4rem; }
  a.app-link {
    display: block;
    padding: 18px 20px;
    margin-bottom: 14px;
    border-radius: 14px;
    background: #fafafa;
    border: 2px solid #f0f0f0;
    text-decoration: none;
    color: #23303a;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.2s;
  }
  a.app-link:hover { border-color: #0d7377; background: #f2fbfa; }
  a.app-link .desc { display: block; font-weight: 400; color: #6b7a84; font-size: 0.85rem; margin-top: 4px; }
</style>
</head>
<body>
  <div class="app">
    <h1>My Apps</h1>
    <a class="app-link" href="pickleball-tournament.html">
      🏓 Pickleball Brackets
      <span class="desc">Players, tournament brackets, and league play</span>
    </a>
    <a class="app-link" href="dinner-decider.html">
      🍽️ Dinner Finder
      <span class="desc">Find nearby restaurants by cuisine and zip code</span>
    </a>
    <a class="app-link" href="dinner-flow.html">
      🎲 What's for Dinner?
      <span class="desc">Branching decision flow with food battle rounds</span>
    </a>
    <a class="app-link" href="tic-tac-toe.html">
      ⭕ Tic-Tac-Toe
      <span class="desc">Classic two-player game</span>
    </a>
  </div>
</body>
</html>
